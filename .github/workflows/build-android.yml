name: Build EduLink Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build EduLink APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 3. Install React + Capacitor dependencies
      - name: Install web dependencies
        working-directory: edulink-app
        run: npm install

      # 4. Build React application
      - name: Build React application
        working-directory: edulink-app
        run: npm run build

      # 5. Sync Capacitor with Android
      # This is important for Camera/FileSystem functionality
      - name: Sync Capacitor Android
        working-directory: edulink-app
        run: npx cap sync android

      # 6. Copy React build into Android assets
      - name: Copy React build into Android assets
        run: |
          rm -rf edulink-app/android/app/src/main/assets/public
          mkdir -p edulink-app/android/app/src/main/assets/public
          cp -R edulink-app/dist/. edulink-app/android/app/src/main/assets/public/

      # 7. Remove invalid placeholder Android resource files
      - name: Remove invalid Android resource files
        run: |
          find edulink-app/android/app/src/main/res -type f -name "0" -delete

      # 8. Install Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 9. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 10. Set up compatible Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 11. Build Android APK
      - name: Build Android APK
        working-directory: edulink-app/android
        run: |
          gradle assembleDebug --no-daemon

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduLink-Eswatini-APK
          path: edulink-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
