name: Build EduLink Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build EduLink APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: edulink-app
        run: npm install

      - name: Build web application
        working-directory: edulink-app
        run: npm run build

      - name: Copy web application into Android assets
        run: |
          rm -rf edulink-app/android/app/src/main/assets/public
          mkdir -p edulink-app/android/app/src/main/assets/public
          cp -r edulink-app/dist/* edulink-app/android/app/src/main/assets/public/

      - name: Remove invalid Android resource files
        run: |
          find edulink-app/android/app/src/main/res -type f -name "0" -delete

      - name: Show Android resources
        run: |
          find edulink-app/android/app/src/main/res -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: edulink-app/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduLink-Eswatini-APK
          path: edulink-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
